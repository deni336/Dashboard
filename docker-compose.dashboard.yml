name: kasugai-dashboard

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    image: ${KASUGAI_DASHBOARD_IMAGE:-kasugai-dashboard:latest}
    environment:
      KASUGAI_SERVER_HOST: ${KASUGAI_SERVER_HOST:?Set KASUGAI_SERVER_HOST to the VPS or private VPN hostname}
      KASUGAI_SERVER_PORT: ${KASUGAI_SERVER_PORT:-8008}
      KASUGAI_FILE_TRANSFER_HOST: ${KASUGAI_FILE_TRANSFER_HOST:-${KASUGAI_SERVER_HOST}}
      KASUGAI_FILE_TRANSFER_PORT: ${KASUGAI_FILE_TRANSFER_PORT:-50051}
      KASUGAI_MEDIA_PORT: ${KASUGAI_MEDIA_PORT:-50052}
      KASUGAI_PUBLIC_URL: ${KASUGAI_PUBLIC_URL:-}
      KASUGAI_TRUST_PROXY: ${KASUGAI_TRUST_PROXY:-false}
      KASUGAI_SESSION_COOKIE_SECURE: ${KASUGAI_SESSION_COOKIE_SECURE:-}
      DENILICENSE_API_URL: ${DENILICENSE_API_URL:-http://denilicense-api:8080}
      DENILICENSE_ISSUER: ${DENILICENSE_ISSUER:-http://127.0.0.1:8080}
      DENILICENSE_PRODUCT_CODE: ${DENILICENSE_PRODUCT_CODE:-KASUGAI}
      DENILICENSE_ACTIVATION_LABEL: ${DENILICENSE_ACTIVATION_LABEL:-Kasugai Dashboard}
      KASUGAI_AI_PROVIDER: ${KASUGAI_AI_PROVIDER:-disabled}
      KASUGAI_AI_BASE_URL: ${KASUGAI_AI_BASE_URL:-}
      KASUGAI_AI_MODEL: ${KASUGAI_AI_MODEL:-gpt-oss:20b}
      KASUGAI_AI_API_KEY: ${KASUGAI_AI_API_KEY:-}
      KASUGAI_AI_API_KEY_FILE: ${KASUGAI_AI_API_KEY_FILE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      KASUGAI_AI_TIMEOUT_SECONDS: ${KASUGAI_AI_TIMEOUT_SECONDS:-300}
      KASUGAI_AI_REQUEST_BUDGET_SECONDS: ${KASUGAI_AI_REQUEST_BUDGET_SECONDS:-330}
      KASUGAI_AI_ALLOWED_USERS: ${KASUGAI_AI_ALLOWED_USERS:-}
      KASUGAI_AI_SOURCE_ALLOWED_USERS: ${KASUGAI_AI_SOURCE_ALLOWED_USERS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
      KASUGAI_GITHUB_TOKEN_ALLOWLIST: ${KASUGAI_GITHUB_TOKEN_ALLOWLIST:-}
      KASUGAI_DEVELOPER_ALLOWED_USERS: ${KASUGAI_DEVELOPER_ALLOWED_USERS:-}
      KASUGAI_REPOSITORY_ROOTS: ${KASUGAI_REPOSITORY_ROOTS:-}
      KASUGAI_REPOSITORY_ALLOWED_ROOTS: ${KASUGAI_REPOSITORY_ALLOWED_ROOTS:-}
      KASUGAI_WORKSTATION_ENABLED: ${KASUGAI_WORKSTATION_ENABLED:-true}
      KASUGAI_WORKSTATION_ALLOWED_USERS: ${KASUGAI_WORKSTATION_ALLOWED_USERS:-}
      KASUGAI_WORKSTATION_RETENTION_HOURS: ${KASUGAI_WORKSTATION_RETENTION_HOURS:-24}
      KASUGAI_WORKSTATION_MAX_AGENTS: ${KASUGAI_WORKSTATION_MAX_AGENTS:-8}
      KASUGAI_WORKSTATION_INTERVAL_SECONDS: ${KASUGAI_WORKSTATION_INTERVAL_SECONDS:-10}
      KASUGAI_HOMELAB_ENABLED: ${KASUGAI_HOMELAB_ENABLED:-true}
      KASUGAI_HOMELAB_ALLOWED_USERS: ${KASUGAI_HOMELAB_ALLOWED_USERS:-}
      KASUGAI_HOMELAB_MAX_AGENTS: ${KASUGAI_HOMELAB_MAX_AGENTS:-8}
      KASUGAI_HOMELAB_INTERVAL_SECONDS: ${KASUGAI_HOMELAB_INTERVAL_SECONDS:-15}
      KASUGAI_HOMELAB_ACTION_POLL_SECONDS: ${KASUGAI_HOMELAB_ACTION_POLL_SECONDS:-5}
      KASUGAI_HOMELAB_SAMPLE_RETENTION_HOURS: ${KASUGAI_HOMELAB_SAMPLE_RETENTION_HOURS:-168}
      KASUGAI_HOMELAB_ACTIONS_ENABLED: ${KASUGAI_HOMELAB_ACTIONS_ENABLED:-false}
      KASUGAI_LAUNCHER_ENABLED: ${KASUGAI_LAUNCHER_ENABLED:-true}
      KASUGAI_LAUNCHER_ALLOWED_USERS: ${KASUGAI_LAUNCHER_ALLOWED_USERS:-}
      KASUGAI_LAUNCHER_MAX_AGENTS: ${KASUGAI_LAUNCHER_MAX_AGENTS:-8}
      KASUGAI_LAUNCHER_CATALOG_INTERVAL_SECONDS: ${KASUGAI_LAUNCHER_CATALOG_INTERVAL_SECONDS:-30}
      KASUGAI_LAUNCHER_POLL_SECONDS: ${KASUGAI_LAUNCHER_POLL_SECONDS:-5}
      KASUGAI_LAUNCHER_RUNS_ENABLED: ${KASUGAI_LAUNCHER_RUNS_ENABLED:-false}
      KASUGAI_AUTOMATION_ENABLED: ${KASUGAI_AUTOMATION_ENABLED:-true}
      KASUGAI_AUTOMATION_ALLOWED_USERS: ${KASUGAI_AUTOMATION_ALLOWED_USERS:-}
      KASUGAI_AUTOMATION_SCHEDULER_SECONDS: ${KASUGAI_AUTOMATION_SCHEDULER_SECONDS:-15}
      KASUGAI_AUTOMATION_TASKS_ENABLED: ${KASUGAI_AUTOMATION_TASKS_ENABLED:-false}
      KASUGAI_INBOX_ENABLED: ${KASUGAI_INBOX_ENABLED:-true}
      KASUGAI_INBOX_ALLOWED_USERS: ${KASUGAI_INBOX_ALLOWED_USERS:-}
      KASUGAI_KNOWLEDGE_ENABLED: ${KASUGAI_KNOWLEDGE_ENABLED:-true}
      KASUGAI_KNOWLEDGE_ALLOWED_USERS: ${KASUGAI_KNOWLEDGE_ALLOWED_USERS:-}
      KASUGAI_SECURITY_ENABLED: ${KASUGAI_SECURITY_ENABLED:-true}
      KASUGAI_SECURITY_ALLOWED_USERS: ${KASUGAI_SECURITY_ALLOWED_USERS:-}
      KASUGAI_AI_TOOLBOX_ENABLED: ${KASUGAI_AI_TOOLBOX_ENABLED:-true}
      KASUGAI_AI_TOOLBOX_ALLOWED_USERS: ${KASUGAI_AI_TOOLBOX_ALLOWED_USERS:-}
      KASUGAI_PERSONAL_HUB_ENABLED: ${KASUGAI_PERSONAL_HUB_ENABLED:-true}
      KASUGAI_PERSONAL_HUB_ALLOWED_USERS: ${KASUGAI_PERSONAL_HUB_ALLOWED_USERS:-}
      KASUGAI_IMAP_HOST: ${KASUGAI_IMAP_HOST:-}
      KASUGAI_IMAP_PORT: ${KASUGAI_IMAP_PORT:-993}
      KASUGAI_IMAP_USERNAME: ${KASUGAI_IMAP_USERNAME:-}
      KASUGAI_IMAP_PASSWORD: ${KASUGAI_IMAP_PASSWORD:-}
      KASUGAI_IMAP_PASSWORD_FILE: ${KASUGAI_IMAP_PASSWORD_FILE:-}
    ports:
      - "${KASUGAI_DASHBOARD_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - dashboard-data:/data
      - dashboard-resources:/app/kasugai/resources
    networks:
      - default
      - denilicense
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  dashboard-data:
    name: kasugai_dashboard-data
  dashboard-resources:
    name: kasugai_dashboard-resources

networks:
  denilicense:
    external: true
    name: denilicense-network
