<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Kasugai License Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">
    <main class="license-login">
        <form class="license-login-form" method="post" action="{{ url_for('auth_bp.login') }}">
            <h1>Kasugai</h1>
            <p class="license-login-meta">{{ product_code }} license via {{ api_url }}</p>

            {% if error %}
                <p class="license-login-error">{{ error }}</p>
            {% endif %}

            <label for="email">DeniLicense Email</label>
            <input type="email" id="email" name="email" value="{{ submitted_email }}" autocomplete="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <label for="claim_code">Claim Code</label>
            <input type="text" id="claim_code" name="claim_code" autocomplete="off">
            <p class="license-login-hint">Optional. Customer accounts only; leave blank when a KASUGAI license is already assigned to the account.</p>

            <button type="submit">Verify License</button>
        </form>
    </main>
</body>

</html>
