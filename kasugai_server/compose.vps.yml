name: kasugai-server

services:
  server:
    image: ${KASUGAI_SERVER_IMAGE:-kasugai-server-vps:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${KASUGAI_PUBLISH_HOST:-127.0.0.1}:8008:8008"
      - "${KASUGAI_PUBLISH_HOST:-127.0.0.1}:50051:50051"
      - "${KASUGAI_PUBLISH_HOST:-127.0.0.1}:50052:50052"
    volumes:
      - server-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  server-data:
